<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cash Transaction</title>

<style>
    *{
        box-sizing:border-box;
        font-family:"Segoe UI", Tahoma, sans-serif;
    }

    body{
        margin:0;
        height:100vh;
        background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .card{
        width:380px;
        background:#fff;
        padding:30px;
        border-radius:15px;
        box-shadow:0 20px 40px rgba(0,0,0,0.25);
        animation:fadeUp .6s ease;
    }

    @keyframes fadeUp{
        from{opacity:0; transform:translateY(20px);}
        to{opacity:1; transform:translateY(0);}
    }

    h2{
        text-align:center;
        margin-bottom:25px;
        color:#333;
        letter-spacing:1px;
    }

    input, select{
        width:100%;
        padding:12px;
        margin-bottom:15px;
        border-radius:8px;
        border:1px solid #ddd;
        font-size:14px;
        transition:.3s;
    }

    input:focus, select:focus{
        outline:none;
        border-color:#2c5364;
        box-shadow:0 0 6px rgba(44,83,100,0.4);
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        background:linear-gradient(135deg,#2c5364,#0f2027);
        color:#fff;
        font-size:15px;
        cursor:pointer;
        transition:.3s;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    .note{
        text-align:center;
        font-size:12px;
        margin-top:12px;
        color:#666;
    }
</style>
</head>

<body>

<div class="card">
    <h2>💰 Cash Transaction</h2>

    <form action="cash_transaction.php" method="POST">
        <input type="text" name="bank_id" placeholder="User Bank ID" required>

        <select name="type" required>
            <option value="">Select Transaction Type</option>
            <option value="credit">Credit (Add Money)</option>
            <option value="debit">Debit (Withdraw Money)</option>
        </select>

        <input type="number" name="amount" placeholder="Amount" required>

        <input type="text" name="reason" placeholder="Reason (optional)">

        <button type="submit">Submit Transaction</button>
    </form>

    <div class="note">
        Authorized Sub-Admin Access 🔐
    </div>
</div>

</body>
</html>
